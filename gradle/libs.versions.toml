[versions]
agp = "8.5.0"
kotlin = "2.0.0"
kotlin-kapt = "2.0.10"
ksp = "2.0.0-1.0.21"
androidxActivity = "1.9.1"
androidxCore = "1.13.1"
androidxLifecycle = "2.8.4"
androidxCompose = "1.7.0-beta07"
androidxComposeMaterial3 = "1.3.0-beta05"
androidxNavigation = "2.8.0-beta04"
androidxHiltNavigationCompose = "1.2.0"
hilt = "2.51.1"
retrofit = "2.11.0"
okHttp = "4.12.0"
glide = "4.12.0"
coroutines = "1.8.1"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
espresso = "3.6.1"
